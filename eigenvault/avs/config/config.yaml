# EigenVault AVS Configuration

# Operator Configuration
operator:
  ecdsa_private_key_store_path: "keys/ecdsa.key"
  bls_private_key_store_path: "keys/bls.key"
  eth_rpc_url: "http://localhost:8545"
  eth_ws_url: "ws://localhost:8546"
  registry_coordinator_address: "0x0000000000000000000000000000000000000000"
  operator_state_retriever_address: "0x0000000000000000000000000000000000000000"
  aggregator_server_ip_port_address: "localhost:8080"
  register_operator_on_startup: true
  eigen_metrics_ip_port_address: "localhost:9090"
  enable_metrics: true
  node_api_ip_port_address: "localhost:8081"
  enable_node_api: true

# Aggregator Configuration
aggregator:
  server_ip_port_address: "localhost:8080"
  eth_rpc_url: "http://localhost:8545"
  registry_coordinator_address: "0x0000000000000000000000000000000000000000"
  operator_state_retriever_address: "0x0000000000000000000000000000000000000000"
  aggregator_private_key_path: "keys/aggregator.key"
  eigen_metrics_ip_port_address: "localhost:9090"
  enable_metrics: true

# Network Configuration
network:
  chain_id: 1  # Mainnet
  block_time: 12  # seconds
  gas_limit: 30000000
  max_priority_fee: 2000000000  # 2 gwei
  max_fee: 50000000000  # 50 gwei

# AVS Configuration
avs:
  minimum_stake: "32000000000000000000"  # 32 ETH
  quorum_threshold: 67  # 67%
  task_response_window: 60  # seconds
  challenge_window: 604800  # 7 days
  minimum_quorum_size: 3
  max_operators: 100

# Logging Configuration
logging:
  level: "info"  # debug, info, warn, error
  format: "json"
  output: "stdout"

# Metrics Configuration
metrics:
  enabled: true
  port: 9090
  path: "/metrics"
  interval: 15  # seconds 